<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f4b" />
    <title>Offline · JOHN PAUL COLLEGE (EduTrack AI)</title>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f3f7fe; color: #0b1f4b; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; text-align: center; }
      main { max-width: 26rem; display: grid; gap: .75rem; justify-items: center; }
      img { width: 6rem; height: 6rem; }
      h1 { margin: .25rem 0 0; font-size: 1.5rem; }
      p { margin: 0; color: #4b5668; line-height: 1.5; }
      button { margin-top: .5rem; font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0 1.5rem; border: 0; border-radius: .625rem; background: #1a45c8; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="John Paul College seal" width="96" height="96" />
      <h1>You are offline</h1>
      <p>EduTrack AI needs an internet connection to load your latest classes, attendance and grades. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
