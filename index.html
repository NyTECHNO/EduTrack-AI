<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f4b" />
    <meta name="application-name" content="EduTrack AI" />
    <meta name="description" content="Academic management for John Paul College, Roxas, Oriental Mindoro." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EduTrack AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>JOHN PAUL COLLEGE (EduTrack AI)</title>
    <script>
      /* Light is the default; dark only if the person chose it. Applied before the first paint so there is no flash.
         Mirrors src/hooks/useTheme.js. */
      (function () {
        try {
          var raw = localStorage.getItem('edutrack.theme');
          var dark = (raw ? JSON.parse(raw) : 'light') === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name=theme-color]');
          if (meta) meta.setAttribute('content', dark ? '#070e22' : '#0b1f4b');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>EduTrack AI needs JavaScript to run. Please turn it on in your browser.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
